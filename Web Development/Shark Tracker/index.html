<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Pond Projects</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
  <script>
    let fishes = [];
    let ripples = [];
    let canvas;

    class Fish {
      constructor(name, link, x, y, size, col, speed, noiseOffset) {
        this.name = name;
        this.link = link;
        this.pos = createVector(x, y);
        this.size = size;
        this.col = col;
        this.speed = speed;
        this.noiseOffset = noiseOffset;
        this.angle = random(TWO_PI);
      }
      update() {
        // wandering via Perlin noise
        const turn = map(noise(this.noiseOffset), 0, 1, -0.05, 0.05);
        this.angle += turn;
        this.noiseOffset += 0.01;
        this.pos.x += this.speed * cos(this.angle);
        this.pos.y += this.speed * sin(this.angle);
        // bounce off edges
        if (this.pos.x < 0) { this.pos.x = 0; this.angle = PI - this.angle; }
        if (this.pos.x > width)  { this.pos.x = width; this.angle = PI - this.angle; }
        if (this.pos.y < 0) { this.pos.y = 0; this.angle = -this.angle; }
        if (this.pos.y > height) { this.pos.y = height; this.angle = -this.angle; }
      }
      display(isHovered) {
        push();
        translate(this.pos.x, this.pos.y);
        rotate(this.angle);
        noStroke();
        fill(this.col);
        // body (steady ellipse)
        ellipse(0, 0, this.size, this.size * 0.6);
        // tail
        fill(red(this.col)*0.8, green(this.col)*0.8, blue(this.col)*0.8);
        triangle(
          -this.size*0.5, 0,
          -this.size*0.9, -this.size*0.2,
          -this.size*0.9,  this.size*0.2
        );
        if (isHovered) {
          stroke(255);
          strokeWeight(2);
          noFill();
          ellipse(0, 0, this.size * 1.3, this.size * 0.8);
        }
        pop();
      }
      isMouseOver(mx, my) {
        return dist(mx, my, this.pos.x, this.pos.y) < this.size * 0.7;
      }
    }

    class Ripple {
      constructor(x, y) {
        this.x = x; this.y = y;
        this.radius = 0;
        this.alpha = 120;
      }
      update() {
        this.radius += 2;
        this.alpha  -= 4;
      }
      display() {
        if (this.alpha <= 0) return;
        noFill();
        stroke(200, 200, 255, this.alpha);
        strokeWeight(1.5);
        circle(this.x, this.y, this.radius * 2);
      }
      isFinished() {
        return this.alpha <= 0;
      }
    }

    function setup() {
      canvas = createCanvas(windowWidth, windowHeight);
      canvas.style('display', 'block');
      textFont('Arial, sans-serif');
      textSize(16);

      // Projects as large fish
      fishes.push(new Fish("Sale.IO",                "project-saleio.html",
                            width*0.2, height*0.5,  90,
                            color(255,128,50), 1.5, random(1000)));
      fishes.push(new Fish("File Integrity Manager", "project-fileintegrity.html",
                            width*0.5, height*0.3,  80,
                            color(50,255,150), 1.8, random(1000)));
      fishes.push(new Fish("Movie Database",         "project-moviedb.html",
                            width*0.8, height*0.6,  70,
                            color(80,150,255), 2.2, random(1000)));
      fishes.push(new Fish("Social Media Bot Promoter","project-socialbot.html",
                            width*0.4, height*0.2,  85,
                            color(230,80,230), 1.7, random(1000)));
      fishes.push(new Fish("Analytics Module",       "project-analytics.html",
                            width*0.6, height*0.4,  75,
                            color(255,200,0), 2.0, random(1000)));
      fishes.push(new Fish("Insights Generator",     "project-insights.html",
                            width*0.3, height*0.8,  80,
                            color(0,200,255), 1.6, random(1000)));
    }

    function draw() {
      // Radial gradient background
      let ctx = drawingContext;
      let radius = dist(width/2, height/2, 0, 0);
      let grad = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, radius);
      grad.addColorStop(0, 'rgba(80,150,200,1)');
      grad.addColorStop(1, 'rgba(20,30,60,1)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      // Update & draw fishes
      let hoveredFish = null;
      for (let f of fishes) {
        f.update();
        const over = f.isMouseOver(mouseX, mouseY);
        if (over) hoveredFish = f;
        f.display(over);
      }

      // Fish-triggered ripples every 120 frames
      if (frameCount % 120 === 0) {
        let f = random(fishes);
        ripples.push(new Ripple(f.pos.x, f.pos.y));
      }

      // Tooltip & cursor
      if (hoveredFish) {
        let w = textWidth(hoveredFish.name);
        fill(0,0,0,150);
        noStroke();
        rect(mouseX+15, mouseY+15, w+10, 20, 5);
        fill(255);
        textAlign(LEFT, CENTER);
        text(hoveredFish.name, mouseX+20, mouseY+25);
        canvas.style('cursor','pointer');
      } else {
        canvas.style('cursor','default');
      }

      // Draw ripples
      for (let r of ripples) {
        r.update();
        r.display();
      }
      ripples = ripples.filter(r => !r.isFinished());
    }

    function mousePressed() {
      // Always create a ripple on click
      ripples.push(new Ripple(mouseX, mouseY));
      // Then, if clicked on a fish, navigate
      for (let f of fishes) {
        if (f.isMouseOver(mouseX, mouseY)) {
          window.location.href = f.link;
          break;
        }
      }
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>
