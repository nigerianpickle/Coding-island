<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RoomieQuest Login 🏠</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
</head>
<body class="login-body">
  <div class="login-container">
    <h1>🧹 RoomieQuest</h1>
    <p>Join your room and start earning coins!</p>

    <input id="email" type="email" placeholder="Enter your email" />
    <input id="roomCode" type="text" placeholder="Room code (e.g. APT123)" />
    <button id="loginBtn">Enter Room</button>

    <p class="small-text">Made with ❤️ by Daniel</p>
  </div>

  <script type="module" src="login.js"></script>
</body>
</html>
