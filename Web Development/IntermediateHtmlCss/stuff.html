<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <table>
        <tr>
            <th>Firstname</th>
            <th>Lastname</th>
            <th>Age</th>
        </tr>
        <tr>
            <td>Jill</td>
            <td>Smith</td>
            <td>50</td>
        </tr>
    </table>
    <textarea>
        This is a simple HTML table with a header row and one data row. The header cells are styled with a light blue background, and the data cells will turn light green when focused.
    </textarea>

    <form action="example.com/path" method="post">
        <label for="first_name">First name</label>
        <input type="text" id="first_name" placeholder="Firstname" name="first_name" required minlength="3"></input>
        <label for="last_name">Last name</label>
        <input type="text" id="last_name" placeholder="Lastname" name="last_name"></input>
        <lable for="age">Age</label>
        <input type="number" id="age" placeholder="Age" name="age"></input>
        <button type="submit">Submit</button>
    </form>

<select name="fashion">
  <optgroup label="Clothing">
    <option value="t_shirt">T-Shirts</option>
    <option value="sweater">Sweaters</option>
    <option value="coats">Coats</option>
  </optgroup>
  <optgroup label="Foot Wear">
    <option value="sneakers">Sneakers</option>
    <option value="boots">Boots</option>
    <option value="sandals">Sandals</option>
  </optgroup>
</select>

<div>
  <label for="child">Child</label>
  <input type="radio" id="child" name="ticket_type" value="child" checked>
   <label for="adult">Adult</label>
  <input type="radio" id="adult" name="ticket_type" value="adult" >
</div>

<div>
  <input type="checkbox" id="sausage" name="topping" value="sausage">
  <label for="sausage">Sausage</label>
<input type="checkbox" id="bacon" name="topping" value="bacon">
  <label for="bacon">Bacon</label>
</div>

<fieldset>
    <legend>Contact Details</legend>
  <label for="first_name">First Name</label>
  <input type="text" id="first_name" name="first_name">

  <label for="last_name">Last Name</label>
  <input type="text" id="last_name" name="last_name">
</fieldset>

</body>
</html>
