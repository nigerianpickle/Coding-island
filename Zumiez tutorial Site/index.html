<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quirky Tutorial Gallery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .annotation {
      @apply absolute bg-white text-black text-xs px-2 py-1 rounded shadow-lg;
    }
  </style>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen flex flex-col items-center justify-start p-6">
  <h1 class="text-4xl font-bold mb-6">🛠️ Work Tutorials</h1>

  <!-- Tutorial List -->
  <div class="w-full max-w-6xl flex gap-4">
    <div class="w-1/3 space-y-3">
      <h2 class="text-xl font-semibold mb-2">Select a Tutorial:</h2>
      <ul class="space-y-2">
        <li><button onclick="showGallery('buildBoard')" class="block w-full bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded transition transform hover:scale-105">How to build a board</button></li>
        <li><button onclick="showGallery('taxForms')" class="block w-full bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded transition transform hover:scale-105">How to print out tax forms</button></li>
        <li><button onclick="showGallery('refund')" class="block w-full bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded transition transform hover:scale-105">How to do a basic refund</button></li>
      </ul>
    </div>

    <!-- Gallery -->
    <div id="gallery" class="w-2/3 bg-gray-800 rounded-lg p-4 relative">
      <div id="galleryImageWrapper" class="relative h-96 overflow-hidden rounded">
        <img id="galleryImage" src="" alt="Tutorial Step" class="w-full h-full object-cover transition-all duration-700 ease-in-out rounded">
        <div id="annotation1" class="annotation hidden top-4 left-4">Step 1: Click the board slot</div>
        <div id="annotation2" class="annotation hidden bottom-4 right-4">Step 2: Add pieces here</div>
      </div>

      <!-- Navigation Buttons -->
      <div class="flex justify-between mt-4">
        <button onclick="prevImage()" class="bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded">← Prev</button>
        <button onclick="nextImage()" class="bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded">Next →</button>
      </div>
    </div>
  </div>

  <script>
    const galleries = {
      buildBoard: {
        images: ['img1.jpg', 'img2.jpg', 'img3.jpg'],
        annotations: [
          ['Step 1: Click the board slot', 'top-4 left-4'],
          ['Step 2: Add pieces here', 'bottom-4 right-4'],
          ['Step 3: Confirm assembly', 'top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2']
        ]
      },
      taxForms: {
        images: ['img4.jpg', 'img5.jpg'],
        annotations: [
          ['Go to Settings > Tax', 'top-4 left-4'],
          ['Print selected tax form', 'bottom-4 left-4']
        ]
      },
      refund: {
        images: ['img6.jpg', 'img7.jpg'],
        annotations: [
          ['Scan the item', 'top-6 left-6'],
          ['Press REFUND button', 'bottom-6 right-6']
        ]
      }
    };

    let currentTutorial = null;
    let currentIndex = 0;

    function showGallery(name) {
      currentTutorial = galleries[name];
      currentIndex = 0;
      updateGallery();
    }

    function updateGallery() {
      if (!currentTutorial) return;
      const imgEl = document.getElementById('galleryImage');
      imgEl.src = currentTutorial.images[currentIndex];

      // Update annotations
      const annotation1 = document.getElementById('annotation1');
      const annotation2 = document.getElementById('annotation2');

      annotation1.classList.add('hidden');
      annotation2.classList.add('hidden');

      const annots = currentTutorial.annotations[currentIndex];
      if (annots) {
        annotation1.textContent = annots[0];
        annotation1.className = `annotation ${annots[1]} opacity-0 animate-fadeIn`;
        annotation1.classList.remove('hidden');

        // Show a second one only if needed
        if (annots.length > 2) {
          annotation2.textContent = annots[2];
          annotation2.className = `annotation ${annots[3]} opacity-0 animate-fadeIn`;
          annotation2.classList.remove('hidden');
        }
      }
    }

    function nextImage() {
      if (!currentTutorial) return;
      currentIndex = (currentIndex + 1) % currentTutorial.images.length;
      updateGallery();
    }

    function prevImage() {
      if (!currentTutorial) return;
      currentIndex = (currentIndex - 1 + currentTutorial.images.length) % currentTutorial.images.length;
      updateGallery();
    }

    // Optional: Tailwind animation
    tailwind.config = {
      theme: {
        extend: {
          animation: {
            fadeIn: 'fadeIn 0.5s ease-out forwards'
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: 0 },
              '100%': { opacity: 1 }
            }
          }
        }
      }
    };
  </script>
</body>
</html>
