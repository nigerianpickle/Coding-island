<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Work Tutorials</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .annotation {
      @apply absolute bg-white text-black text-xs px-2 py-1 rounded shadow-lg transition-all duration-500;
    }
    .fade-in {
      opacity: 0;
      animation: fadeIn 0.8s ease-in-out forwards;
    }
    .zoom {
      animation: zoomIn 0.6s ease-in-out forwards;
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    @keyframes zoomIn {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body class="bg-zinc-900 text-white font-sans min-h-screen overflow-x-hidden">
  <div class="max-w-7xl mx-auto px-6 py-10 fade-in">
    <h1 class="text-5xl font-extrabold mb-10 text-center text-purple-400 animate-bounce">📚 Training Portal</h1>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- Sidebar -->
      <div class="bg-zinc-800 p-4 rounded-lg shadow-md animate-slide-in-left">
        <h2 class="text-xl font-semibold mb-4">Tutorials</h2>
        <ul class="space-y-2">
          <li><button onclick="showTutorial('sevenSteps')" class="w-full text-left bg-zinc-700 hover:bg-purple-700 px-4 py-2 rounded transition-all">Seven Steps to Selling</button></li>
          <li><button onclick="showTutorial('refund')" class="w-full text-left bg-zinc-700 hover:bg-purple-700 px-4 py-2 rounded transition-all">How to do Basic Refund</button></li>
          <li><button onclick="showTutorial('exchange')" class="w-full text-left bg-zinc-700 hover:bg-purple-700 px-4 py-2 rounded transition-all">How to do Basic Exchange</button></li>
          <li><button onclick="showTutorial('buildBoard')" class="w-full text-left bg-zinc-700 hover:bg-purple-700 px-4 py-2 rounded transition-all">How to Build a Board</button></li>

        </ul>
      </div>

      <!-- Tutorial Viewer -->
      <div id="viewer" class="md:col-span-2 bg-zinc-800 p-6 rounded-lg relative shadow-lg">
        <h2 id="tutorialTitle" class="text-2xl font-bold mb-4">Select a Tutorial</h2>

        <div class="relative h-80 mb-4 overflow-hidden">
          <img id="tutorialImage" src="./img/tutorial-logo.jpg" class="w-full h-full object-cover rounded transition-all duration-700 ease-in-out zoom" alt="Tutorial step">
          <div id="annotation" class="annotation hidden top-2 left-2">Step info</div>
        </div>

        <p id="tutorialText" class="mb-4 text-sm text-gray-300 transition-opacity duration-500">Instructions will appear here.</p>

        <div class="flex justify-between">
          <button onclick="prevStep()" class="bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded transition-transform hover:scale-105">← Prev</button>
          <button onclick="nextStep()" class="bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded transition-transform hover:scale-105">Next →</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tutorials = {
        sevenSteps: {
        title: "Seven steps to selling",
        steps: [
          {
            img: "./img/step1.png",
            annotation: { text: "Open the board package", pos: "top-2 left-2" },
            text: "Greet the customer"
          },
          {
            img: "./img/step2.png",
            annotation: { text: "Align connectors", pos: "bottom-4 right-4" },
            text: "Build rapport with the customer"
          },
          {
            img: "./img/step3.png",
            annotation: { text: "Final step!", pos: "top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2" },
            text: "Identify the customer's needs and wants"
          },
          {
            img: "./img/step4.png",
            annotation: { text: "Final step!", pos: "top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2" },
            text: "Product knowledge and recommendations"
          },
          {
            img: "./img/step5.png",
            annotation: { text: "Final step!", pos: "top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2" },
            text: "Alternatives and advice"
          },
          {
            img: "./img/step6.png",
            annotation: { text: "Final step!", pos: "top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2" },
            text: "Suggest add-ons and accessories"
          },
          {
            img: "./img/step7.png",
            annotation: { text: "Final step!", pos: "top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2" },
            text: "Continue the experience with the customer"
          },


        ]
      },
      refund: {
        title: "How to Do a Basic Refund",
        steps: [
          {
            img: "img6.jpg",
            annotation: { text: "Scan item", pos: "top-2 left-2" },
            text: "Offer an exchange, Just in case the customer would prefer that."
          },
          {
            img: "img6.jpg",
            annotation: { text: "Scan item", pos: "top-2 left-2" },
            text: "If the customer prefers a refund, ask for proof of purchase.(We do not accept returns without one)"
          },
          {
            img: "img5.jpg",
            annotation: { text: "Select refund option", pos: "bottom-4 right-4" },
            text: "When you have gotten proof, log into the POS system and select {transaction}."
          },
          {
            img: "img4.jpg",
            annotation: { text: "Enter amount", pos: "top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2" },
            text: "the next window should be a pop like this. Ask the customer if they have a number or email with us, if they do, enter it here. If not, enter create a new customer"
          },
          {
            img: "img6.jpg",
            annotation: { text: "Process refund", pos: "top-2 left-2" },
            text: "Enter the details of the customer. You do not need their birthdate, but you should enter one that is older than 18"
          },
          {
            img: "img7.jpg",
            annotation: { text: "Confirm refund", pos: "bottom-4 right-4" },
            text: "When you have gotten their information, click on the add refund button. This will open a new window where you can choose the refund item based on the reciept.If it an online order you just enter no proof of purchase."
          },
          {
            img: "img6.jpg",
            annotation: { text: "Scan item", pos: "top-2 left-2" },
            text: "Manually click on the item they want to refund and enter the reason for the refund"
          },
          {
            img: "img6.jpg",
            annotation: { text: "Scan item", pos: "top-2 left-2" },
            text: "Click enter and at this point if  the customer wanted to exchange or add new items you can do that now."
          },
          {
            img: "img6.jpg",
            annotation: { text: "Scan item", pos: "top-2 left-2" },
            text: "Enter the sales code of whoever did the original transaction."
          },
          {
            img: "img6.jpg",
            annotation: { text: "Scan item", pos: "top-2 left-2" },
            text: "Click the enter the next screen and follow through like it is a normal transaction. The customer needs to have their original card.(WE DO NOT GIVE CASH REFUNDS). If you have any questions make sure to ask your 2nd Asm"
          }

        ]
      },
      
      exchange: {
        title: "How to Do a Basic Exchange",
        steps: [
          {
            img: "img5.jpg",
            annotation: { text: "Select refund option", pos: "bottom-4 right-4" },
            text: "When you have gotten proof, log into the POS system and select {transaction}."
          },
          {
            img: "img4.jpg",
            annotation: { text: "Enter amount", pos: "top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2" },
            text: "the next window should be a pop like this. Ask the customer if they have a number or email with us, if they do, enter it here. If not, enter create a new customer"
          },
          {
            img: "img6.jpg",
            annotation: { text: "Process refund", pos: "top-2 left-2" },
            text: "Enter the details of the customer. You do not need their birthdate, but you should enter one that is older than 18"
          },
          {
            img: "img7.jpg",
            annotation: { text: "Confirm refund", pos: "bottom-4 right-4" },
            text: "When you have gotten their information, click on the add refund button. This will open a new window where you can choose the refund item based on the reciept.If it an online order you just enter no proof of purchase."
          },
          {
            img: "img6.jpg",
            annotation: { text: "Scan item", pos: "top-2 left-2" },
            text: "Manually click on the item they want to refund and enter the reason for the refund"
          },
          {
            img: "img6.jpg",
            annotation: { text: "Scan item", pos: "top-2 left-2" },
            text: "Click enter and at this point add the new item they want to exchange for."
          },
          {
            img: "img6.jpg",
            annotation: { text: "Scan item", pos: "top-2 left-2" },
            text: "Enter the sales code of whoever did the original transaction."
          },
          {
            img: "img6.jpg",
            annotation: { text: "Scan item", pos: "top-2 left-2" },
            text: "Click the enter the next screen and follow through like it is a normal transaction. The customer needs to have their original card.(WE DO NOT GIVE CASH REFUNDS). If you have any questions make sure to ask your 2nd Asm"
          }

        ]
      }

    };

    let currentTutorial = null;
    let currentStep = 0;

    function showTutorial(key) {
      currentTutorial = tutorials[key];
      currentStep = 0;
      updateStep();
    }

    function updateStep() {
      if (!currentTutorial) return;
      const step = currentTutorial.steps[currentStep];
      document.getElementById('tutorialTitle').textContent = currentTutorial.title;

      const img = document.getElementById('tutorialImage');
      img.classList.remove('zoom');
      void img.offsetWidth;
      img.classList.add('zoom');
      img.src = step.img;

      const annotation = document.getElementById('annotation');
      annotation.textContent = step.annotation.text;
      annotation.className = `annotation ${step.annotation.pos}`;
      annotation.classList.remove('hidden');

      const text = document.getElementById('tutorialText');
      text.style.opacity = 0;
      setTimeout(() => {
        text.textContent = step.text;
        text.style.opacity = 1;
      }, 200);
    }

    function nextStep() {
      if (!currentTutorial) return;
      currentStep = (currentStep + 1) % currentTutorial.steps.length;
      updateStep();
    }

    function prevStep() {
      if (!currentTutorial) return;
      currentStep = (currentStep - 1 + currentTutorial.steps.length) % currentTutorial.steps.length;
      updateStep();
    }
  </script>
</body>
</html>
