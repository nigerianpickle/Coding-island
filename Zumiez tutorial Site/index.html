<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Tutorials</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom styles */
    .annotation {
      position: absolute;
      background-color: white;
      color: black;
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      border-radius: 0.5rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: all 0.5s;
      z-index: 10;
    }
    .fade-in { opacity: 0; animation: fadeIn 0.8s ease-in-out forwards; }
    .zoom { animation: zoomIn 0.6s ease-in-out forwards; }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes zoomIn { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    /* Image styling */
    .tutorial-image { object-fit: contain; width: 100%; height: auto; max-height: 400px; border-radius: 0.5rem; }

    /* Layout */
    .container { max-width: 1200px; margin: auto; padding: 2rem; }
    .tutorial-card { background-color: #1f2937; padding: 1.5rem; border-radius: 1rem; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .button { background-color: #6b21a8; color: white; border: none; padding: 0.8rem 2rem; border-radius: 0.5rem; cursor: pointer; transition: background-color 0.3s ease; }
    .button:hover { background-color: #9333ea; }
    .tutorial-header { text-align: center; font-size: 3rem; color: #9333ea; font-weight: 700; animation: bounce 1s infinite; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    /* Text formatting */
    .step-text p { margin-bottom: 0.75rem; }
    .step-text strong { display: block; font-size: 1rem; color: #f3f4f6; }
    .step-text span { display: block; font-size: 0.9rem; color: #9ca3af; margin-left: 0.5rem; }

    /* Animations */
    .text-fade { opacity: 0; animation: textFade 1s ease-in-out forwards; }
    @keyframes textFade { to { opacity: 1; } }
  </style>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen">
  <div class="container fade-in">
    <h1 class="tutorial-header text-fade" style="animation-delay: 0.5s;">📚 Work Tutorials</h1>
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mt-8">
      <!-- Sidebar -->
      <div class="tutorial-card text-fade" style="animation-delay: 0.7s;">
        <h2 class="text-2xl font-semibold mb-4">Tutorials</h2>
        <ul class="space-y-2">
          <li><button onclick="showTutorial('sevenSteps')" class="w-full text-left button">Seven Steps to Selling</button></li>
          <li><button onclick="showTutorial('refund')" class="w-full text-left button">How to Do a Basic Refund</button></li>
          <li><button onclick="showTutorial('exchange')" class="w-full text-left button">How to Do a Basic Exchange</button></li>
        </ul>
      </div>
      <!-- Viewer -->
      <div id="viewer" class="tutorial-card md:col-span-3 text-fade" style="animation-delay: 0.9s;">
        <h2 id="tutorialTitle" class="text-3xl font-bold mb-4">Select a Tutorial</h2>
        <div class="relative mb-4">
          <img id="tutorialImage" class="tutorial-image zoom" src="./img/tutorial-logo.jpg" alt="Tutorial Step Image" loading="lazy">
          <div id="annotation" class="annotation hidden">Step info</div>
        </div>
        <div class="step-text mb-4 text-fade" style="animation-delay: 1.1s;">
          <!-- Dynamic content injected here -->
        </div>
        <div class="flex justify-between">
          <button onclick="prevStep()" class="button">← Prev</button>
          <button onclick="nextStep()" class="button">Next →</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tutorials = {
      sevenSteps: {
        title: 'Seven Steps to Selling',
        steps: [
          { img: './img/step1.png', annotation: { text: 'Greet customers within 10 feet or 10 seconds', pos: 'top-0 left-0' }, what: 'Greet customers within 10 feet of the door or within 10 seconds of entry.', why: 'This initial interaction sets the tone for the customer\'s shopping experience, making them feel welcomed and valued.', how: 'Use open-ended questions like, "What brings you in today?" to engage customers and start a conversation.' },
          { img: './img/step2.png', annotation: { text: 'Engage in friendly conversation', pos: 'top-0 left-0' }, what: 'Engage customers in a friendly, non-salesy manner.', why: 'Building rapport helps in understanding customer needs and preferences, leading to personalized service.', how: 'Ask about their interests, local events, or recent activities to establish a connection.' },
          { img: './img/step3.png', annotation: { text: 'Identify needs & wants', pos: 'top-0 left-0' }, what: 'Determine what the customer is looking for, both in terms of necessity and desire.', why: 'Understanding their needs allows you to recommend products that truly match their requirements, enhancing satisfaction.', how: 'Ask probing questions like, "Are you looking for something specific today?" or "What kind of style are you into?"' },
          { img: './img/step4.png', annotation: { text: 'Product knowledge', pos: 'top-0 left-0' }, what: 'Demonstrate a deep understanding of the products you sell.', why: 'Being knowledgeable builds trust and credibility, reassuring customers about their purchase decisions.', how: 'Stay informed about the features, benefits, and uses of the products. Share this information confidently with customers.' },
          { img: './img/step5.png', annotation: { text: 'Make recommendations', pos: 'top-0 left-0' }, what: 'Suggest products that align with the customer\'s needs and preferences.', why: 'Personalized recommendations show that you understand the customer\'s desires, potentially increasing sales.', how: 'Based on their interests, propose items that complement their choices, like, "This hoodie pairs great with those jeans."' },
          { img: './img/step6.png', annotation: { text: 'Overcome objections', pos: 'top-0 left-0' }, what: 'Address any concerns or hesitations the customer may have.', why: 'Resolving objections helps in moving the customer closer to making a purchase.', how: 'Listen attentively to their concerns and provide solutions or alternatives.' },
          { img: './img/step7.png', annotation: { text: 'Close the sale', pos: 'top-0 left-0' }, what: 'Encourage the customer to make a purchase decision.', why: 'A clear and confident close can lead to a successful transaction.', how: 'Use closing techniques like, "Would you like to take this to the register?" or "Can I help you find anything else to go with this?"' }
        ]
      },
      refund: {
        title: 'How to Do a Basic Refund',
        
        steps: [
          { img: './img/offerAnExchange.png', annotation: { text: 'Offer An exchange', pos: 'top-1 left-1' }, what: 'Offer an exchange, just in case the customer would prefer that.', why: 'Provides an alternative solution to retain sale value.', how: 'Suggest swapping items instead of refund.' },
          { img: './img/getReceipt.png', annotation: { text: 'Get proof', pos: 'top-2 left-2' }, what: 'If customer prefers refund, ask for proof of purchase.', why: 'Validates transaction eligibility.', how: 'Request receipt or order email.' },
          { img: './img/homescreen.jpg', annotation: { text: 'Select cart(Engage windows app) ', pos: 'bottom-4 right-4' }, what: 'Log into POS and select cart.', why: 'Initiates refund process in system.', how: 'Navigate to transaction menu and choose “Refund”.' },
          { img: './img/customerSearchScreen.jpg', annotation: { text: 'Enter Customer Details', pos: 'top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2' }, what: 'Get customer information for refund', why: 'Associates refund with customer record.', how: 'Input existing profile or create new profile.' },
          { img: './img/customerCreationScreen.jpg', annotation: { text: 'Create Customer', pos: 'top-2 left-2' }, what: 'Enter customer details; age must be 18+(Can be random).', why: 'Meets legal compliance.', how: 'Fill required field and click done.' },
          { img: './img/refundButtonView.jpg', annotation: { text: 'Add a refund', pos: 'bottom-4 right-4' }, what: 'Click “Add Refund”', why: 'Selects items eligible for refund.', how: 'Click “Add Refund” and choose receipt.(If it is an online order, click no proof of purchase)' },
          { img: './img/addReturnItemScreen.jpg', annotation: { text: 'Select item being returned', pos: 'top-2 left-2' }, what: 'Manually select item and enter reason.', why: 'Captures return analytics.', how: 'Choose valid reason code.(If it a online order, you have to just scan the item being returned)' },
          { img: './img/.jpg', annotation: { text: 'Finalize', pos: 'top-2 left-2' }, what: 'When you\'re done the items should appear as negative balances. Ring it through like a regular transaction.', why: 'In order to get the customer their money[WE DO NOT ACCEPT CASH RETURNS-ASK YOUR MANAGER ON DUTY FOR HELp]', how: 'Enter the code of whoever did the original order. If no one did it, enter ZMZ as the sales code' },
          { img: './img/.jpg', annotation: { text: 'Complete the transaction', pos: 'top-2 left-2' }, what: 'Follow prompts; refund to original card only.', why: 'Ensures proper payment reversal.', how: 'Swipe or tap original card.' }
        ]
      },
      exchange: {
        title: 'How to Do a Basic Exchange',
        steps: [
  
          { img: './img/getReceipt.png', annotation: { text: 'Get proof', pos: 'top-2 left-2' }, what: 'Ask for proof of purchase.', why: 'Validates transaction eligibility.', how: 'Request receipt or order email.' },
          { img: './img/listenAttentive.png', annotation: { text: 'Understand why they want to exchange', pos: 'top-1 left-1' }, what: 'Listen attenively to the customers\'s need', why: 'So you\'re able to help to the best of your abilities.', how: 'Remain quiet and ask questions if you have any.' },
          { img: './img/helptheCustomer.png', annotation: { text: 'Help with the exchange ', pos: 'top-1/2 left-1/2' }, what: 'Help the customer with the exchange and try to even upsell the exchange (e.g Show them new bogo outfits  )', why: 'To give the customer what they want or need', how: 'Engage with the customer! Ask about their day, and try use your 7 steps!' },
          { img: './img/homescreen.jpg', annotation: { text: 'Select cart(Engage windows app) ', pos: 'bottom-4 right-4' }, what: 'Log into POS and select cart.', why: 'Initiates refund process in system.', how: 'Navigate to transaction menu and choose “Refund”.' },
          { img: './img/customerSearchScreen.jpg', annotation: { text: 'Enter Customer Details', pos: 'top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2' }, what: 'Get customer information for refund', why: 'Associates refund with customer record.', how: 'Input existing profile or create new profile.' },
          { img: './img/customerCreationScreen.jpg', annotation: { text: 'Create Customer', pos: 'top-2 left-2' }, what: 'Enter customer details; age must be 18+(Can be random).', why: 'Meets legal compliance.', how: 'Fill required field and click done.' },
          { img: './img/addReturnItemScreen.jpg', annotation: { text: 'Add a exhange items', pos: 'bottom-4 right-4' }, what: 'Click “Add Refund”', why: 'Selects items eligible for refund.', how: 'Click “Add Refund” and choose receipt.(If it is an online order, click no proof of purchase)' },
          { img: './img/reasonForReturn.jpg', annotation: { text: 'Select item being returned', pos: 'top-2 left-2' }, what: 'Manually select item and enter reason.', why: 'Captures return analytics.', how: 'Choose valid reason code.(If it a online order, you have to just scan the item being returned)' },
          { img: 'img6.jpg', annotation: { text: 'Finalize', pos: 'top-2 left-2' }, what: 'When you\'re done the items should appear as negative balances. Ring it through like a regular transaction.', why: 'In order to get the customer their money[WE DO NOT ACCEPT CASH RETURNS-ASK YOUR MANAGER ON DUTY FOR HELp]', how: 'Enter the code of whoever did the original order. If no one did it, enter ZMZ as the sales code' },
          { img: 'img6.jpg', annotation: { text: 'Complete the transaction', pos: 'top-2 left-2' }, what: 'Follow prompts; refund to original card only.', why: 'Ensures proper payment reversal.', how: 'Swipe or tap original card.' }
        ]
      }
    };

    let currentTutorial = null; let currentStep = 0;
    function showTutorial(key) { currentTutorial = tutorials[key]; currentStep = 0; document.getElementById('tutorialTitle').textContent = currentTutorial.title; updateStep(); }
    function updateStep() {
      if (!currentTutorial) return; const step = currentTutorial.steps[currentStep];
      const img = document.getElementById('tutorialImage'); img.classList.remove('zoom'); void img.offsetWidth; img.classList.add('zoom'); img.src = step.img;
      const annotation = document.getElementById('annotation'); annotation.textContent = step.annotation.text; annotation.className = `annotation ${step.annotation.pos}`; annotation.classList.remove('hidden');
      const container = document.querySelector('.step-text');
      container.innerHTML = `
        <p class="text-fade" style="animation-delay: 1.2s;"><strong>What:</strong> <span>${step.what}</span></p>
        <p class="text-fade" style="animation-delay: 1.3s;"><strong>Why:</strong> <span>${step.why}</span></p>
        <p class="text-fade" style="animation-delay: 1.4s;"><strong>How:</strong> <span>${step.how}</span></p>
      `;
    }
    function nextStep() { if (!currentTutorial) return; currentStep = (currentStep + 1) % currentTutorial.steps.length; updateStep(); }
    function prevStep() { if (!currentTutorial) return; currentStep = (currentStep - 1 + currentTutorial.steps.length) % currentTutorial.steps.length; updateStep(); }
  </script>
</body>
</html>
